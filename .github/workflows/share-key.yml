name: Share key

on:
  issues:
    types: [labeled]

permissions:
  issues: write

jobs:
  key:
    if: github.actor == 'Nalathan01' && contains(github.event.issue.labels.*.name, 'spot-key') && (github.event.label.name == 'freigeschaltet' || github.event.label.name == 'gesperrt')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Update key
        env:
          CF_TOKEN: ${{ secrets.CF_KV_TOKEN }}
          ACCOUNT: 2e612c8d6148792d997890d05b56b048
          NAMESPACE: 349fbb587ab34ce19b75c31b35221b02
          BODY: ${{ github.event.issue.body }}
          LABEL: ${{ github.event.label.name }}
          ISSUE: ${{ github.event.issue.number }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: python
        run: |
          import json, os, re, subprocess, urllib.request, datetime
          body = os.environ["BODY"]
          def field(title):
              m = re.search(r"###\s*" + re.escape(title) + r"[^\n]*\n+(.+?)(?:\n###|\Z)", body, re.S)
              return m.group(1).strip() if m else ""
          code = field("Anfrage Code").lower()
          name = re.sub(r"[\x00-\x1f<>]", "", field("Anzeigename")).strip()[:24]
          cc = field("Land").upper()
          cc = cc if re.fullmatch(r"[A-Z]{2}", cc) else ""
          def say(msg, close):
              subprocess.run(["gh", "issue", "comment", os.environ["ISSUE"], "-R", os.environ["REPO"], "-b", msg], check=True)
              if close:
                  subprocess.run(["gh", "issue", "close", os.environ["ISSUE"], "-R", os.environ["REPO"]], check=True)
          if not re.fullmatch(r"[0-9a-f]{32}", code) or not name or name.lower() in ("_no response_",):
              say("Anfrage Code oder Name fehlt oder ist ungültig. Request code or name missing or invalid.", False)
              raise SystemExit(1)
          url = f"https://api.cloudflare.com/client/v4/accounts/{os.environ['ACCOUNT']}/storage/kv/namespaces/{os.environ['NAMESPACE']}/values/req:{code}"
          headers = {"Authorization": "Bearer " + os.environ["CF_TOKEN"]}
          rec = {"name": name, "cc": cc, "active": os.environ["LABEL"] == "freigeschaltet", "issue": int(os.environ["ISSUE"]), "changed": datetime.date.today().isoformat()}
          req = urllib.request.Request(url, data=json.dumps(rec).encode(), method="PUT", headers=dict(headers, **{"Content-Type": "application/json"}))
          urllib.request.urlopen(req, timeout=30).read()
          if rec["active"]:
              say(f"Freigeschaltet als **{name}** ({cc or '-'}). Im Tool unter Einstellungen, Spots teilen, auf **Prüfen und speichern** klicken.\n\nEnabled as **{name}** ({cc or '-'}). In the tool go to Settings, Share spots and click **Check and save**.", True)
          else:
              say("Teilen für diesen Schlüssel gesperrt. Sharing disabled for this key.", True)

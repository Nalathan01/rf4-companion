name: rf4check
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  win:
    runs-on: windows-latest
    steps:
      - shell: pwsh
        env:
          RF4_MIRROR_KEY: ${{ secrets.RF4_MIRROR_KEY }}
        run: |
          "Schluessel vorhanden: $($env:RF4_MIRROR_KEY.Length -eq 64)"
          foreach ($h in @(@{}, @{ "X-RF4-Mirror-Key" = $env:RF4_MIRROR_KEY })) {
            try { $r = Invoke-WebRequest "https://rf4.fish/api/wechat/positions?limit=1" -Headers $h -UserAgent "RF4Companion/2.0" -UseBasicParsing; "Header $($h.Count): $($r.StatusCode)" }
            catch { $resp = $_.Exception.Response; "Header $($h.Count): $([int]$resp.StatusCode) cf-mitigated=$($resp.Headers.GetValues('cf-mitigated') -join ',') server=$($resp.Headers.Server)" }
          }
  linux:
    runs-on: ubuntu-latest
    steps:
      - env:
          RF4_MIRROR_KEY: ${{ secrets.RF4_MIRROR_KEY }}
        run: |
          curl -s -o /dev/null -w "ohne: %{http_code}\n" -A "RF4Companion/2.0" "https://rf4.fish/api/wechat/positions?limit=1"
          curl -s -o /dev/null -w "mit: %{http_code}\n" -A "RF4Companion/2.0" -H "X-RF4-Mirror-Key: $RF4_MIRROR_KEY" "https://rf4.fish/api/wechat/positions?limit=1"

name: ocrtest
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq tesseract-ocr tesseract-ocr-chi-sim > /dev/null && pip install -q pillow numpy
      - run: |
          curl -s -A "RF4CompanionMirror/1.0" -o c.jpg "https://cdn.rf4.com.cn/public/position/13027875566394465.jpg"
          cat > t.py <<'PY'
          import numpy as np, subprocess
          from PIL import Image, ImageOps
          im = Image.open("c.jpg").convert("RGB"); a = np.asarray(im).max(axis=2)
          dark = a < 28
          rows = np.where(dark.mean(axis=1) > 0.15)[0]; cols = np.where(dark.mean(axis=0) > 0.15)[0]
          print("size", im.size, "dark rows", rows.min() if len(rows) else None, rows.max() if len(rows) else None, "cols", cols.min() if len(cols) else None, cols.max() if len(cols) else None)
          from collections import deque
          small = dark[::4, ::4]; h, w = small.shape; seen = np.zeros_like(small); best = None
          for y in range(h):
              for x in range(w):
                  if not small[y, x] or seen[y, x]: continue
                  q = deque([(y, x)]); seen[y, x] = True; n = 0; y0 = y1 = y; x0 = x1 = x
                  while q:
                      cy, cx = q.popleft(); n += 1; y0 = min(y0, cy); y1 = max(y1, cy); x0 = min(x0, cx); x1 = max(x1, cx)
                      for ny, nx in ((cy-1, cx), (cy+1, cx), (cy, cx-1), (cy, cx+1)):
                          if 0 <= ny < h and 0 <= nx < w and small[ny, nx] and not seen[ny, nx]: seen[ny, nx] = True; q.append((ny, nx))
                  fill = n / ((x1-x0+1)*(y1-y0+1))
                  if fill > 0.55 and (x1-x0) > w/12 and (y1-y0) > h/8 and (best is None or n > best[0]): best = (n, x0*4, y0*4, (x1+1)*4, (y1+1)*4)
          print("box", best)
          crop = ImageOps.invert(ImageOps.grayscale(im.crop(best[1:])))
          for sc in (2, 3, 4):
              for psm in ("6", "4"):
                  g = crop.resize((crop.width*sc, crop.height*sc), Image.LANCZOS); g.save("g.png")
                  out = subprocess.run(["tesseract", "g.png", "-", "-l", "chi_sim", "--psm", psm], capture_output=True, text=True).stdout
                  print("== crop scale", sc, "psm", psm); print(" | ".join(x.replace(" ", "") for x in out.splitlines() if x.strip()))
          PY
          python3 t.py

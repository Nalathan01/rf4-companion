name: Discord

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

concurrency:
  group: discord
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  discord:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache/restore@v4
        with:
          path: dc-data
          key: discord-${{ github.run_id }}
          restore-keys: discord-
      - name: Read Discord
        shell: pwsh
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
        run: |
          New-Item -ItemType Directory -Force dc-feed, dc-data | Out-Null
          python tools/dc_feed.py dc-feed/dc_feed.json
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Text recognition languages
        shell: pwsh
        continue-on-error: true
        run: |
          foreach ($l in "de-DE", "ru-RU") { Add-WindowsCapability -Online -Name "Language.OCR~~~$l~0.0.1.0" | Out-Null }
      - name: Build
        shell: pwsh
        run: ./build.ps1 -OutFile "$env:RUNNER_TEMP\app\RF4 Companion.exe"
      - name: Merge into mirror
        shell: pwsh
        env:
          KEY: ${{ secrets.DATA_DEPLOY_KEY }}
        run: |
          $k = Join-Path $env:RUNNER_TEMP "deploy_key"
          [IO.File]::WriteAllText($k, $env:KEY.Replace("`r", "") + "`n")
          $env:GIT_SSH_COMMAND = "ssh -i `"$k`" -o StrictHostKeyChecking=accept-new"
          $exe = "$env:RUNNER_TEMP\app\RF4 Companion.exe"
          $out = Join-Path $env:RUNNER_TEMP "out"
          $env:DC_IMG_DIR = Join-Path $env:RUNNER_TEMP "img"
          New-Item -ItemType Directory -Force $out, $env:DC_IMG_DIR | Out-Null
          for ($try = 1; $try -le 3; $try++) {
            $pub = Join-Path $env:RUNNER_TEMP "pub$try"
            git clone -q --depth 1 -b mirror git@github.com:Nalathan01/rf4-companion-data.git $pub
            $sha = git -C $pub rev-parse HEAD
            $p = Start-Process -FilePath $exe -ArgumentList "-DcMerge", "`"$PWD\dc-feed`"", "`"$pub\spots.json.gz`"", "`"$out\spots.json.gz`"", "-DataDir", "`"$PWD\dc-data`"" -Wait -PassThru
            Get-Content dc-data\app.log -Tail 5
            if ($p.ExitCode -eq 3) { exit 0 }
            if ($p.ExitCode -ne 0) { exit 1 }
            if (Get-ChildItem $env:DC_IMG_DIR -File) {
              $im = Join-Path $env:RUNNER_TEMP "dcimg"
              if (git ls-remote --heads git@github.com:Nalathan01/rf4-companion-data.git dcimg) {
                git clone -q --depth 1 -b dcimg git@github.com:Nalathan01/rf4-companion-data.git $im
              } else {
                git init -q $im; git -C $im checkout -q --orphan dcimg
                git -C $im remote add origin git@github.com:Nalathan01/rf4-companion-data.git
              }
              Move-Item "$env:DC_IMG_DIR\*" $im -Force
              git -C $im config user.name "rf4-mirror"
              git -C $im config user.email "rf4-mirror@users.noreply.github.com"
              git -C $im add -A
              git -C $im commit -q -m "Discord images $(Get-Date -AsUTC -Format 'yyyy-MM-ddTHH:mmZ')"
              git -C $im push -q origin dcimg
              if ($LASTEXITCODE -ne 0) { exit 1 }
              Remove-Item $im -Recurse -Force
            }
            Copy-Item "$out\spots.json.gz" $pub -Force
            git -C $pub config user.name "rf4-mirror"
            git -C $pub config user.email "rf4-mirror@users.noreply.github.com"
            git -C $pub checkout -q --orphan next
            git -C $pub add -A
            git -C $pub commit -q -m "Spiegel $(Get-Date -AsUTC -Format 'yyyy-MM-ddTHH:mmZ') Discord"
            git -C $pub push -q --force-with-lease="mirror:$sha" origin next:mirror
            if ($LASTEXITCODE -eq 0) { exit 0 }
            Start-Sleep 20
          }
          exit 1
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: dc-data
          key: discord-${{ github.run_id }}

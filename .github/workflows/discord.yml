name: Discord

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

concurrency:
  group: discord
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  discord:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Nalathan01/rf4-companion-pipeline
          ssh-key: ${{ secrets.PIPELINE_DEPLOY_KEY }}
          path: .pipeline
      - name: Private part
        shell: pwsh
        run: ./.pipeline/overlay.ps1 | Out-Null
      - uses: actions/cache/restore@v4
        with:
          path: dc-data
          key: discord-${{ github.run_id }}
          restore-keys: discord-
      - name: Read Discord
        shell: pwsh
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
        run: |
          New-Item -ItemType Directory -Force dc-feed, dc-data | Out-Null
          python tools/dc_feed.py dc-feed/dc_feed.json
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Build
        shell: pwsh
        run: ./build.ps1 -OutFile "$env:RUNNER_TEMP\app\RF4 Companion.exe"
      - name: Merge into mirror
        shell: pwsh
        env:
          KEY: ${{ secrets.DATA_DEPLOY_KEY }}
        run: |
          $k = Join-Path $env:RUNNER_TEMP "deploy_key"
          [IO.File]::WriteAllText($k, $env:KEY.Replace("`r", "") + "`n")
          $env:GIT_SSH_COMMAND = "ssh -i `"$k`" -o StrictHostKeyChecking=accept-new"
          $repo = "git@github.com:Nalathan01/rf4-companion-data.git"
          $exe = "$env:RUNNER_TEMP\app\RF4 Companion.exe"
          $out = Join-Path $env:RUNNER_TEMP "out"
          $env:DC_IMG_DIR = Join-Path $env:RUNNER_TEMP "img"
          $env:DC_IMG_KEEP = Join-Path $env:RUNNER_TEMP "keep.txt"
          New-Item -ItemType Directory -Force $out, $env:DC_IMG_DIR | Out-Null
          for ($try = 1; $try -le 3; $try++) {
            $pub = Join-Path $env:RUNNER_TEMP "pub$try"
            git clone -q --depth 1 -b mirror $repo $pub
            $sha = git -C $pub rev-parse HEAD
            $p = Start-Process -FilePath $exe -ArgumentList "-DcMerge", "`"$PWD\dc-feed`"", "`"$pub\spots.json.gz`"", "`"$out\spots.json.gz`"", "-DataDir", "`"$PWD\dc-data`"" -Wait -PassThru
            Get-Content dc-data\app.log -Tail 5
            if ($p.ExitCode -eq 3) { exit 0 }
            if ($p.ExitCode -ne 0) { exit 1 }
            $keep = @(Get-Content $env:DC_IMG_KEEP)
            $im = Join-Path $env:RUNNER_TEMP "dcimg$try"
            New-Item -ItemType Directory -Force $im | Out-Null
            if (git ls-remote --heads $repo dcimg) {
              $old = Join-Path $env:RUNNER_TEMP "dcimg_old$try"
              git clone -q --depth 1 -b dcimg $repo $old
              Get-ChildItem $old -File | Where-Object { $keep -contains $_.Name } | Copy-Item -Destination $im
            }
            Get-ChildItem $env:DC_IMG_DIR -File | Where-Object { $keep -contains $_.Name } | Copy-Item -Destination $im -Force
            git init -q $im
            git -C $im checkout -q --orphan dcimg
            git -C $im config user.name "rf4-mirror"
            git -C $im config user.email "rf4-mirror@users.noreply.github.com"
            git -C $im add -A
            git -C $im commit -q --allow-empty -m "Discord images $(Get-Date -AsUTC -Format 'yyyy-MM-ddTHH:mmZ')"
            git -C $im push -q --force $repo dcimg
            if ($LASTEXITCODE -ne 0) { exit 1 }
            Copy-Item "$out\spots.json.gz" $pub -Force
            git -C $pub config user.name "rf4-mirror"
            git -C $pub config user.email "rf4-mirror@users.noreply.github.com"
            git -C $pub checkout -q --orphan next
            git -C $pub add -A
            git -C $pub commit -q -m "Spiegel $(Get-Date -AsUTC -Format 'yyyy-MM-ddTHH:mmZ') Discord"
            git -C $pub push -q --force-with-lease="mirror:$sha" origin next:mirror
            if ($LASTEXITCODE -eq 0) { exit 0 }
            Start-Sleep 20
          }
          exit 1
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: dc-data
          key: discord-${{ github.run_id }}
  next:
    needs: discord
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: write
    steps:
      - run: sleep 720
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run discord.yml -R ${{ github.repository }} --ref main

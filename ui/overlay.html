<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RF4 Companion Overlay</title>
<style>
html, body { margin: 0; padding: 0; background: transparent; overflow: hidden; }
html.cover, html.cover body { background: rgb(var(--bg)); height: 100%; }
html.cover .row { background: rgba(255, 255, 255, 0.06); }
body { --bg: 10, 18, 28; --op: 0.72; --fg: #ffffff; --tc: #f2c14e; --rc: #c78bff; --r: 0.45em; font-family: var(--font, "Segoe UI", system-ui, sans-serif); color: var(--fg); font-size: calc(18px * var(--s, 1)); padding: 0.5em; }
.head { font-size: 0.8em; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; opacity: 0.85; margin: 0 0 0.35em 0.2em; text-shadow: 0 1px 3px rgba(0,0,0,0.9); }
.list { display: flex; flex-direction: column; gap: 0.3em; }
.row { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 0.6em; padding: 0.35em 0.7em; border-radius: var(--r); background: rgba(var(--bg), var(--op)); border-left: 0.22em solid rgba(255,255,255,0.35); text-shadow: 0 1px 2px rgba(0,0,0,0.8); }
.row.trophy { border-left-color: var(--tc); }
.row.rare { border-left-color: var(--rc); }
.row.new { animation: pop 0.6s ease-out; }
.time { font-size: 0.78em; opacity: 0.75; font-variant-numeric: tabular-nums; }
.fish { font-weight: 600; line-height: 1.2; overflow-wrap: anywhere; }
.right { display: flex; align-items: center; gap: 0.45em; white-space: nowrap; }
.w { font-variant-numeric: tabular-nums; }
.badge { font-size: 0.68em; font-weight: 700; padding: 0.12em 0.45em; border-radius: 0.3em; color: #111; background: var(--tc); text-shadow: none; }
.rare .badge { background: var(--rc); color: #111; }
.empty { opacity: 0.7; font-size: 0.85em; padding: 0.3em 0.7em; text-shadow: 0 1px 3px rgba(0,0,0,0.9); }
@keyframes pop { from { opacity: 0; transform: translateX(-0.8em); } to { opacity: 1; transform: none; } }
</style>
</head>
<body>
<div class="head" id="head"></div>
<div class="list" id="list"></div>
<script>
const P = new URLSearchParams(location.search);
const size = Math.max(50, Math.min(300, parseInt(P.get("size") || "100", 10) || 100));
document.body.style.setProperty("--s", size / 100);
const showTitle = P.get("title") !== "0";
if (P.get("cover") === "1") document.documentElement.classList.add("cover");
const hex = k => /^[0-9a-f]{6}$/i.test(P.get(k) || "") ? P.get(k) : null;
const num = (k, a, b) => { const v = parseInt(P.get(k), 10); return isNaN(v) ? null : Math.max(a, Math.min(b, v)); };
const FONTS = { segoe: '"Segoe UI", sans-serif', arial: "Arial, sans-serif", verdana: "Verdana, sans-serif", tahoma: "Tahoma, sans-serif", georgia: "Georgia, serif", trebuchet: '"Trebuchet MS", sans-serif', consolas: "Consolas, monospace", impact: "Impact, sans-serif" };
const st = document.body.style;
if (hex("bg")) st.setProperty("--bg", [0, 2, 4].map(i => parseInt(hex("bg").substr(i, 2), 16)).join(", "));
if (num("op", 0, 100) !== null) st.setProperty("--op", num("op", 0, 100) / 100);
if (hex("fg")) st.setProperty("--fg", "#" + hex("fg"));
if (hex("tc")) st.setProperty("--tc", "#" + hex("tc"));
if (hex("rc")) st.setProperty("--rc", "#" + hex("rc"));
if (num("r", 0, 30) !== null) st.setProperty("--r", (num("r", 0, 30) / 20) + "em");
if (FONTS[P.get("font")]) st.setProperty("--font", FONTS[P.get("font")]);
const q = new URLSearchParams();
["n", "lang", "trophy"].forEach(k => { if (P.get(k)) q.set(k, P.get(k)); });
let last = "", known = null;
function esc(s) { return String(s == null ? "" : s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }
async function load() {
  try {
    const r = await fetch("/overlay/data?" + q.toString(), { cache: "no-store" });
    if (!r.ok) return;
    const txt = await r.text();
    if (txt === last) return;
    last = txt;
    const d = JSON.parse(txt);
    document.getElementById("head").textContent = showTitle ? d.labels.title : "";
    document.getElementById("head").style.display = showTitle ? "" : "none";
    const ids = new Set(d.items.map(i => i.id));
    document.getElementById("list").innerHTML = d.items.length ? d.items.map(i =>
      `<div class="row ${i.level}${known && !known.has(i.id) ? " new" : ""}"><span class="time">${esc(i.time)}</span><span class="fish">${esc(i.fish)}</span><span class="right"><span class="w">${esc(i.weight)}</span>${i.level ? `<span class="badge">${esc(d.labels[i.level])}</span>` : ""}</span></div>`).join("")
      : `<div class="empty">${esc(d.labels.empty)}</div>`;
    known = ids;
  } catch (e) { }
}
load();
setInterval(load, 1000);
</script>
</body>
</html>

<!doctype html>
<html lang="de" translate="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RF4 Companion</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%234fa8c9'/%3E%3Cpath d='M6 17c4-6 12-7 17-1l3-3v8l-3-3c-5 6-13 5-17-1z' fill='%2306202b'/%3E%3C/svg%3E">
<style>
:root {
  color-scheme: dark;
  --bg: #111315;
  --rail: #16181b;
  --surface: #1b1e21;
  --surface-2: #22262a;
  --surface-3: #2a2f34;
  --line: #2c3136;
  --line-soft: #23272b;
  --ink: #f0efec;
  --ink-2: #c3c2b7;
  --muted: #8a8d88;
  --accent: #4fa8c9;
  --accent-hover: #67b9d7;
  --accent-soft: rgba(79, 168, 201, 0.14);
  --accent-ink: #06202b;
  --hot: #e0803a;
  --warm: #d8b24a;
  --cold: #5f625d;
  --radius: 14px;
  --font: "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
  --font-display: "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif;
  --mono: "Cascadia Mono", Consolas, monospace;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 14px; line-height: 1.45; display: flex; flex-direction: column; overflow: hidden; }
button, input, select { font: inherit; color: inherit; }
::selection { background: var(--accent); color: var(--accent-ink); }
::-webkit-scrollbar { width: 12px; height: 12px; }
::-webkit-scrollbar-thumb { background: var(--surface-3); border-radius: 8px; border: 3px solid transparent; background-clip: padding-box; }
::-webkit-scrollbar-track { background: transparent; }

header { display: flex; align-items: center; gap: 18px; padding: 14px 22px; border-bottom: 1px solid var(--line-soft); background: var(--rail); }
.brand { display: flex; align-items: center; gap: 11px; min-width: 210px; }
.brand-mark { width: 34px; height: 34px; border-radius: 10px; background: linear-gradient(145deg, #74c3e0, #2f86a7); display: grid; place-items: center; box-shadow: 0 6px 18px rgba(79,168,201,0.25), inset 0 1px 0 rgba(255,255,255,0.3); }
.brand h1 { font-family: var(--font-display); font-size: 16px; font-weight: 650; margin: 0; }
.brand p { margin: 0; font-size: 11.5px; color: var(--muted); }
nav { display: flex; gap: 6px; flex: 1; justify-content: center; }
.nav-btn { border: 1px solid transparent; background: transparent; border-radius: 999px; padding: 8px 18px; cursor: pointer; color: var(--ink-2); font-weight: 600; }
.nav-btn:hover { background: var(--surface); color: var(--ink); }
.nav-btn.active { background: var(--accent-soft); border-color: rgba(79,168,201,0.5); color: var(--ink); }
.head-acts { display: flex; align-items: center; gap: 8px; min-width: 210px; justify-content: flex-end; }
.icon-btn { width: 36px; height: 36px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); display: grid; place-items: center; cursor: pointer; color: var(--ink-2); }
.icon-btn:hover { color: var(--ink); border-color: var(--surface-3); }
.upd { display: none; align-items: center; gap: 8px; background: var(--accent-soft); border: 1px solid rgba(79,168,201,0.4); border-radius: 999px; padding: 5px 6px 5px 12px; font-size: 12.5px; }
.upd.show { display: flex; }

.btn { border: 1px solid var(--line); background: var(--surface-2); border-radius: 10px; padding: 7px 14px; cursor: pointer; font-weight: 600; }
.btn:hover { border-color: var(--surface-3); background: var(--surface-3); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { background: var(--accent-hover); }
.btn.small { padding: 4px 10px; font-size: 12.5px; border-radius: 8px; }

main { flex: 1; min-height: 0; display: flex; }
.view { flex: 1; min-height: 0; display: none; }
.view.active { display: flex; }

.split { display: grid; grid-template-columns: minmax(420px, 1fr) minmax(420px, 1.1fr); width: 100%; min-height: 0; }
.col { min-height: 0; overflow-y: auto; padding: 22px 24px; }
.col.map-col { padding: 22px 24px 22px 0; display: flex; flex-direction: column; }
.title-row { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 4px; }
.title-row h2 { font-family: var(--font-display); font-size: 26px; margin: 0; font-weight: 700; letter-spacing: -0.3px; }
.sub { color: var(--muted); font-size: 13px; margin: 0 0 16px; }
.filters { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
.chk { display: inline-flex; align-items: center; gap: 6px; color: var(--ink-2); font-size: 13px; cursor: pointer; padding: 0 4px; }
.chk input { accent-color: var(--accent); width: 15px; height: 15px; }
.seg { display: inline-flex; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 3px; }
.seg button { border: 0; background: transparent; padding: 5px 12px; border-radius: 7px; cursor: pointer; color: var(--ink-2); font-weight: 600; font-size: 13px; }
.seg button.on { background: var(--surface-3); color: var(--ink); }
select { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 6px 10px; min-width: 200px; }

.cards { display: flex; flex-direction: column; gap: 10px; }
.card { background: var(--surface); border: 1px solid var(--line-soft); border-radius: var(--radius); padding: 13px 15px; cursor: pointer; display: grid; grid-template-columns: 14px 1fr auto; gap: 4px 12px; transition: border-color 0.15s, background 0.15s; }
.card:hover { border-color: var(--line); background: var(--surface-2); }
.card.sel { border-color: rgba(79,168,201,0.65); box-shadow: inset 3px 0 0 var(--accent); }
.dot { width: 11px; height: 11px; border-radius: 50%; margin-top: 6px; background: var(--cold); }
.dot.hot { background: var(--hot); box-shadow: 0 0 0 4px rgba(224,128,58,0.18); }
.dot.warm { background: var(--warm); }
.card .where { font-weight: 650; font-size: 15px; }
.card .where small { color: var(--muted); font-weight: 500; font-size: 13px; margin-left: 6px; }
.card .ago { color: var(--ink-2); font-size: 12.5px; text-align: right; white-space: nowrap; }
.card .line { grid-column: 2 / 4; color: var(--ink-2); font-size: 13px; }
.card .meta { grid-column: 2 / 4; color: var(--muted); font-size: 12px; display: flex; flex-wrap: wrap; gap: 6px 12px; }
.tag { display: inline-block; background: var(--surface-3); border-radius: 6px; padding: 1px 7px; margin: 0 4px 2px 0; font-size: 12.5px; color: var(--ink); }
.tag.b { background: rgba(79,168,201,0.16); }
.empty { color: var(--muted); padding: 30px 10px; text-align: center; }

.mapbox { position: relative; flex: 1; min-height: 0; background: var(--surface); border: 1px solid var(--line-soft); border-radius: var(--radius); overflow: hidden; }
.mapbox canvas { position: absolute; inset: 0; width: 100%; height: 100%; cursor: grab; }
.mapbox .maplabel { position: absolute; left: 12px; top: 10px; background: rgba(17,19,21,0.78); border-radius: 8px; padding: 4px 10px; font-weight: 650; font-size: 13px; }
.mapbox .maphint { position: absolute; left: 12px; bottom: 10px; background: rgba(17,19,21,0.78); border-radius: 8px; padding: 3px 9px; font-size: 12px; color: var(--muted); }

.detail { flex: 1; min-height: 0; overflow-y: auto; margin-top: 14px; }
.map-col .mapbox { flex: 1.15; }
.d-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin: 2px 2px 10px; }
.d-head h3 { margin: 0; font-family: var(--font-display); font-size: 19px; }
.d-head .d-sum { color: var(--muted); font-size: 12.5px; }
.ev { background: var(--surface); border: 1px solid var(--line-soft); border-radius: 12px; padding: 11px 13px; margin-bottom: 9px; }
.ev-top { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; }
.ev-fish { font-weight: 650; }
.ev-fish .w { color: var(--accent); margin-left: 6px; font-weight: 600; }
.ev-time { color: var(--muted); font-size: 12px; white-space: nowrap; }
.ev-facts { display: flex; flex-wrap: wrap; gap: 4px 14px; color: var(--ink-2); font-size: 12.5px; margin-top: 4px; }
.ev-det { font-size: 12.5px; color: var(--ink-2); margin-top: 5px; }
.ev-det b { color: var(--muted); font-weight: 600; }
.ev-src { margin-top: 7px; display: flex; flex-wrap: wrap; gap: 6px; }
.src { font-size: 12px; border: 1px solid var(--line); border-radius: 999px; padding: 2px 9px; color: var(--ink-2); background: transparent; cursor: pointer; }
.src:hover { color: var(--ink); border-color: var(--accent); }
.src.off { cursor: default; opacity: 0.7; border-style: dashed; }
.src.off:hover { border-color: var(--line); color: var(--ink-2); }
.fromimg { font-size: 11px; color: var(--accent); border: 1px solid rgba(79,168,201,0.4); border-radius: 6px; padding: 0 5px; margin-left: 4px; }
.orig { margin-top: 7px; font-size: 12.5px; }
.orig summary { cursor: pointer; color: var(--muted); }
.orig summary:hover { color: var(--ink-2); }
.orig div { white-space: pre-wrap; background: var(--surface-2); border-radius: 8px; padding: 8px 10px; margin-top: 5px; color: var(--ink-2); }
.orig small { display: block; color: var(--muted); margin-top: 4px; }
.thumbs { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
.thumbs img { height: 74px; border-radius: 8px; border: 1px solid var(--line); cursor: zoom-in; background: var(--surface-2); }
.lightbox { position: fixed; inset: 0; background: rgba(0,0,0,0.82); display: none; place-items: center; z-index: 50; cursor: zoom-out; }
.lightbox.show { display: grid; }
.lightbox img { max-width: 92vw; max-height: 90vh; border-radius: 10px; }
.placeholder { margin: auto; text-align: center; color: var(--muted); max-width: 520px; }
.placeholder h2 { color: var(--ink); font-family: var(--font-display); }
.status { position: fixed; right: 16px; bottom: 14px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; padding: 6px 12px; font-size: 12.5px; color: var(--ink-2); display: none; }
.status.show { display: block; }
.find-split { grid-template-columns: minmax(340px, 0.75fr) minmax(520px, 1.6fr); }
.search { width: 100%; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 9px 12px; margin-bottom: 10px; outline: none; }
.search:focus { border-color: var(--accent); }
.banner { display: none; background: rgba(224,128,58,0.12); border: 1px solid rgba(224,128,58,0.45); border-radius: 12px; padding: 10px 13px; margin-bottom: 12px; font-size: 13px; color: var(--ink); }
.banner.show { display: block; }
.fish-list { display: flex; flex-direction: column; gap: 2px; }
.fish-row { display: flex; justify-content: space-between; gap: 10px; padding: 7px 11px; border-radius: 9px; cursor: pointer; color: var(--ink-2); }
.fish-row:hover { background: var(--surface); color: var(--ink); }
.fish-row.sel { background: var(--accent-soft); color: var(--ink); box-shadow: inset 3px 0 0 var(--accent); }
.fish-row .n { color: var(--muted); font-variant-numeric: tabular-nums; font-size: 12.5px; }
.hdr { color: var(--muted); font-size: 11.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.6px; margin: 18px 2px 8px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 5px 12px; cursor: pointer; font-size: 13px; color: var(--ink-2); }
.chip:hover { color: var(--ink); border-color: var(--surface-3); }
.chip.on { background: var(--accent-soft); border-color: rgba(79,168,201,0.6); color: var(--ink); }
.chip .n { color: var(--muted); margin-left: 6px; font-size: 12px; }
.tbl { width: 100%; border-collapse: collapse; font-size: 13px; }
.tbl th { text-align: left; color: var(--muted); font-weight: 600; font-size: 12px; padding: 6px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.tbl td { padding: 7px 8px; border-bottom: 1px solid var(--line-soft); color: var(--ink-2); vertical-align: top; }
.tbl td:first-child { color: var(--ink); }
.tbl td.num, .tbl th.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.tbl td small { display: block; color: var(--muted); font-size: 11.5px; margin-top: 2px; }
.note { color: var(--ink-2); font-size: 13px; background: var(--surface); border: 1px solid var(--line-soft); border-radius: 12px; padding: 10px 13px; margin-top: 10px; }
.mini-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 8px; }
.mini { background: var(--surface); border: 1px solid var(--line-soft); border-radius: 12px; padding: 10px 12px; cursor: pointer; }
.mini:hover { border-color: rgba(79,168,201,0.6); }
.mini .top { display: flex; justify-content: space-between; gap: 8px; font-weight: 650; }
.mini .top span { color: var(--muted); font-weight: 500; font-size: 12px; }
.mini .b { color: var(--ink-2); font-size: 12.5px; margin-top: 4px; }
.boot { position: fixed; inset: 0; z-index: 100; background: var(--bg); display: grid; place-items: center; transition: opacity .35s; }
.boot.hide { opacity: 0; pointer-events: none; }
.boot-box { width: min(420px, 86vw); text-align: center; }
.boot-box .brand-mark { width: 56px; height: 56px; margin: 0 auto 18px; border-radius: 16px; }
.boot-box h2 { font-family: var(--font-display); font-size: 24px; margin: 0 0 22px; color: var(--ink); }
.boot-bar { height: 6px; border-radius: 3px; background: var(--surface-3); overflow: hidden; }
.boot-bar div { height: 100%; width: 0; background: var(--accent); border-radius: 3px; transition: width .4s; }
.boot-step { margin-top: 12px; color: var(--muted); font-size: 13.5px; min-height: 1.4em; }
</style>
</head>
<body>
<div class="boot" id="boot"><div class="boot-box">
  <div class="brand-mark"><svg width="30" height="30" viewBox="0 0 32 32"><path d="M5 17c4-6 12-7 17-1l4-4v10l-4-4c-5 6-13 5-17-1z" fill="#06202b"/></svg></div>
  <h2>RF4 Companion</h2>
  <div class="boot-bar"><div id="bootBar"></div></div>
  <div class="boot-step" id="bootStep">Wird gestartet</div>
</div></div>
<header>
  <div class="brand">
    <div class="brand-mark"><svg width="20" height="20" viewBox="0 0 32 32"><path d="M5 17c4-6 12-7 17-1l4-4v10l-4-4c-5 6-13 5-17-1z" fill="#06202b"/></svg></div>
    <div><h1>RF4 Companion</h1><p id="ver"></p></div>
  </div>
  <nav>
    <button class="nav-btn" data-view="find" data-t="navFind">Fisch finden</button>
    <button class="nav-btn active" data-view="active" data-t="navActive">Aktive Spots</button>
    <button class="nav-btn" data-view="log" data-t="navLog">Mein Fangbuch</button>
  </nav>
  <div class="head-acts">
    <div class="upd" id="upd"><span id="updText"></span><button class="btn small primary" id="updBtn" data-t="updateNow">Aktualisieren</button></div>
    <select id="lang" style="min-width:0"></select>
    <button class="icon-btn" id="gear" title=""><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3.2"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/></svg></button>
  </div>
</header>
<main>
  <section class="view" id="view-find">
    <div class="split find-split">
      <div class="col">
        <div class="title-row"><h2 data-t="navFind">Fisch finden</h2></div>
        <p class="sub" id="findSub"></p>
        <div class="banner" id="resetBanner"></div>
        <input class="search" id="findQ" type="search" autocomplete="off">
        <div class="filters">
          <div class="seg" id="winSeg"><button data-w="week" class="on"></button><button data-w="reset24"></button><button data-w="48h"></button></div>
          <select id="regionSel" style="min-width:120px"></select>
          <select id="tableSel" style="min-width:150px"></select>
        </div>
        <div id="baitHits"></div>
        <div class="fish-list" id="fishList"></div>
      </div>
      <div class="col" id="findDetail"></div>
    </div>
  </section>
  <section class="view active" id="view-active">
    <div class="split">
      <div class="col">
        <div class="title-row"><h2 data-t="activeTitle">Aktive Spots</h2><button class="btn small" id="syncBtn" data-t="refresh">Aktualisieren</button></div>
        <p class="sub" id="activeSub"></p>
        <div class="filters">
          <div class="seg" id="hoursSeg">
            <button data-h="6">6 h</button><button data-h="24" class="on">24 h</button><button data-h="72">3 d</button><button data-h="168">7 d</button>
          </div>
          <select id="lakeSel"></select>
          <label class="chk"><input type="checkbox" id="allChk"> <span data-t="includeNoSetup">Auch Fänge ohne Montage</span></label>
        </div>
        <div class="cards" id="cards"></div>
      </div>
      <div class="col map-col">
        <div class="mapbox" id="mapbox"><canvas id="map"></canvas><div class="maplabel" id="mapLabel"></div><div class="maphint" id="mapHint"></div></div>
        <div class="detail" id="detail"></div>
      </div>
    </div>
  </section>
  <section class="view" id="view-log"><div class="placeholder"><h2 data-t="navLog">Mein Fangbuch</h2><p>…</p></div></section>
</main>
<div class="status" id="status"></div>
<div class="lightbox" id="lightbox"><img id="lbImg"></div>
<script>
const TOKEN = new URLSearchParams(location.search).get("t");
let OCRV = -1;
let S = {}, INIT = null, ACTIVE = [], HOURS = 24, LAKE = "", SEL = null, DATAV = -1;
const $ = id => document.getElementById(id);
function T(k, fb) { return (S[k] != null && S[k] !== "") ? S[k] : (fb != null ? fb : k); }
async function api(path, body) {
  const r = await fetch(path + (path.includes("?") ? "&" : "?") + "t=" + TOKEN, body === undefined ? {} : { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
  const j = await r.json();
  if (!r.ok) throw new Error(j.error + (j.arg ? ": " + j.arg : ""));
  return j;
}
function esc(s) { return String(s == null ? "" : s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }
function ago(h) {
  if (h < 1) return T("agoMinutes", "vor {0} Min.").replace("{0}", Math.max(1, Math.round(h * 60)));
  if (h < 48) return T("agoHours", "vor {0} Std.").replace("{0}", Math.round(h));
  return T("agoDays", "vor {0} Tagen").replace("{0}", Math.round(h / 24));
}
function applyStrings() {
  document.querySelectorAll("[data-t]").forEach(el => { const k = el.getAttribute("data-t"); if (S[k]) el.textContent = S[k]; });
  $("gear").title = T("settings", "Einstellungen");
  document.documentElement.lang = INIT.lang;
}
async function boot() {
  const BOOT = { bootGame: "Spieldaten werden geladen", bootData: "Meldungen werden geladen", bootSpots: "Spots werden ausgewertet", bootRecords: "Rekordlisten werden geladen", bootFinish: "Fast fertig" };
  const until = Date.now() + 90000;
  while (Date.now() < until) {
    try {
      const p = await api("/api/ping");
      if (p.ready && !INIT) { INIT = await api("/api/init"); S = INIT.strings; }
      $("bootBar").style.width = (p.started ? 100 : p.stepPct || 0) + "%";
      if (p.step) $("bootStep").textContent = T(p.step, BOOT[p.step] || "");
      if (p.started) break;
    } catch (e) {}
    await new Promise(r => setTimeout(r, 200));
  }
  if (!INIT) INIT = await api("/api/init");
  S = INIT.strings;
  $("ver").textContent = "Version " + INIT.version;
  $("lang").innerHTML = INIT.langs.map(l => `<option value="${l}" ${l === INIT.lang ? "selected" : ""}>${l.toUpperCase()}</option>`).join("");
  fillLakes();
  applyStrings();
  findStatic();
  await loadActive();
  loadFind();
  $("boot").classList.add("hide");
  setTimeout(() => $("boot").remove(), 400);
  setInterval(ping, 5000);
}
function fillLakes() {
  $("lakeSel").innerHTML = `<option value="">${esc(T("allLakes", "Alle Gewässer"))}</option>` + INIT.lakes.filter(l => l.map).map(l => `<option value="${l.id}" ${l.id === LAKE ? "selected" : ""}>${esc(l.name)}</option>`).join("");
}
async function ping() {
  try {
    const p = await api("/api/ping");
    if (p.update) { $("upd").classList.add("show"); $("updText").textContent = T("updateAvailable", "Version {0} ist verfügbar").replace("{0}", p.update); }
    $("status").classList.toggle("show", !!p.syncing);
    if (p.syncing) $("status").textContent = T("syncing", "Wird abgeglichen") + (p.syncState ? " · " + p.syncState : "");
    if (DATAV !== -1 && p.data !== DATAV) loadActive();
    DATAV = p.data;
    if (OCRV !== -1 && p.ocr !== OCRV) { DETAIL_KEY = null; loadActive(); }
    OCRV = p.ocr;
    if (p.spot) openSpotKey(p.spot);
  } catch (e) {}
}
async function loadActive() {
  const r = await api("/api/active?hours=" + HOURS + "&lake=" + encodeURIComponent(LAKE) + ($("allChk").checked ? "&all=1" : ""));
  ACTIVE = r.spots;
  $("activeSub").textContent = T("activeSub", "{0} Spots mit Meldungen in diesem Zeitraum").replace("{0}", ACTIVE.length) + (r.synced ? " · " + T("lastSync", "Stand") + " " + new Date(r.synced).toLocaleTimeString(INIT.lang, { hour: "2-digit", minute: "2-digit" }) : "");
  if (!SEL || !ACTIVE.find(s => s.key === SEL)) SEL = ACTIVE.length ? ACTIVE[0].key : null;
  renderCards();
  drawMap();
  DETAIL_KEY = null;
  loadDetail();
}
function heat(s) { return s.hoursAgo < 6 ? "hot" : (s.hoursAgo < 24 ? "warm" : ""); }
function renderCards() {
  if (!ACTIVE.length) { $("cards").innerHTML = `<div class="empty">${esc(T("activeEmpty", "Keine Meldungen in diesem Zeitraum."))}</div>`; return; }
  $("cards").innerHTML = ACTIVE.map(s => `
    <div class="card ${s.key === SEL ? "sel" : ""}" data-key="${esc(s.key)}">
      <div class="dot ${heat(s)}"></div>
      <div class="where">${esc(s.lakeName)}<small>${esc(s.name)}</small></div>
      <div class="ago">${esc(ago(s.hoursAgo))}</div>
      <div class="line">${s.fish.map(f => `<span class="tag">${esc(f.name)}</span>`).join("")}${s.baits.map(b => `<span class="tag b">${esc(b.name)}</span>`).join("")}</div>
      <div class="meta"><span>${esc(T("catchesN", "{0} Fänge").replace("{0}", s.catches))}</span><span>${esc(s.sources.join(", "))}</span>${s.clip ? `<span>Clip ${esc(s.clip)} m</span>` : ""}</div>
    </div>`).join("");
  document.querySelectorAll(".card").forEach(c => c.onclick = () => { SEL = c.dataset.key; renderCards(); drawMap(); loadDetail(); });
}
const IMG = {};
let VIEW = { lake: null, zoom: 1, cx: 0.5, cy: 0.5 };
let MARKS = [];
function markAt(x, y) {
  let best = null, bd = 14;
  for (const m of MARKS) { const d = Math.hypot(m.x-x, m.y-y); if (d < bd) { bd = d; best = m; } }
  return best;
}
function lakeById(id) { return INIT.lakes.find(l => l.id === id); }
function drawMap() {
  const sel = ACTIVE.find(s => s.key === SEL);
  const lakeId = sel ? sel.lake : (LAKE || null);
  const cv = $("map"), box = $("mapbox");
  const w = box.clientWidth, h = box.clientHeight, dpr = window.devicePixelRatio || 1;
  cv.width = w * dpr; cv.height = h * dpr;
  const g = cv.getContext("2d"); g.setTransform(dpr, 0, 0, dpr, 0, 0); g.clearRect(0, 0, w, h);
  const lake = lakeId ? lakeById(lakeId) : null;
  $("mapLabel").textContent = lake ? lake.name + (sel ? " · " + sel.name : "") : "";
  $("mapHint").textContent = lake ? "" : T("mapPickSpot", "Spot links anklicken");
  if (!lake || !lake.map) return;
  if (VIEW.lake !== lake.id) { VIEW = { lake: lake.id, zoom: 1, cx: 0.5, cy: 0.5 }; }
  let img = IMG[lake.map];
  if (!img) { img = new Image(); img.onload = drawMap; img.src = lake.map; IMG[lake.map] = img; return; }
  if (!img.complete) return;
  const side = Math.min(w, h) * VIEW.zoom;
  const ox = w / 2-VIEW.cx * side, oy = h / 2-VIEW.cy * side;
  g.imageSmoothingQuality = "high";
  g.drawImage(img, ox, oy, side, side);
  MARKS = [];
  for (const s of ACTIVE) {
    if (s.lake !== lake.id) continue;
    const x = ox + s.nx * side, y = oy + s.ny * side, isSel = s.key === SEL;
    MARKS.push({ key: s.key, x, y });
    const col = s.hoursAgo < 6 ? "#e0803a" : (s.hoursAgo < 24 ? "#d8b24a" : "#8a8d88");
    g.beginPath(); g.arc(x, y, isSel ? 9 : 6, 0, Math.PI * 2);
    g.fillStyle = col; g.fill(); g.lineWidth = isSel ? 3 : 2; g.strokeStyle = isSel ? "#ffffff" : "rgba(17,19,21,0.85)"; g.stroke();
    if (isSel || VIEW.zoom > 1.6) {
      g.font = "600 12px Segoe UI"; const t = s.name; const tw = g.measureText(t).width;
      g.fillStyle = "rgba(17,19,21,0.82)"; g.fillRect(x + 11, y-9, tw + 10, 18);
      g.fillStyle = "#f0efec"; g.fillText(t, x + 16, y + 4);
    }
  }
}
function openSpotKey(k) { SEL = k; renderCards(); drawMap(); loadDetail(); }
let DETAIL_KEY = null;
async function loadDetail() {
  const key = SEL;

  if (DETAIL_KEY === key) return;
  DETAIL_KEY = key;
  let d;

  if (SEL !== key) return;
  const dirs = d.dirs.length ? T("castDir", "Wurfrichtung") + ": " + d.dirs.slice(0, 3).map(x => x.dir + (x.n > 1 ? " (" + x.n + ")" : "")).join(", ") : "";
  const sum = T("catchesN", "{0} Fänge").replace("{0}", d.totalEvents) + " · " + T("reportsN", "{0} Meldungen").replace("{0}", d.totalReports);
  $("detail").innerHTML = `<div class="d-head"><h3>${esc(d.lakeName)} · ${esc(d.name)}</h3><span class="d-sum">${esc(sum)}${dirs ? " · " + esc(dirs) : ""}</span></div>` +
    d.events.map((e, i) => `
    <div class="ev">
      <div class="ev-top"><div class="ev-fish">${esc(e.fish.join(", ") || (e.mixed ? T("mixedFish", "Verschiedene Fische") : T("unknownFish", "Fisch unbekannt")))}</div><div class="ev-time">${esc(ago(e.hoursAgo))}</div></div>
      <div class="ev-facts">${e.clip ? `<span>Clip ${esc(e.clip)} m</span>` : ""}${e.depth ? `<span>${esc(T("depth", "Tiefe"))} ${esc(e.depth)} m</span>` : ""}${e.dir ? `<span>${esc(T("castDir", "Wurfrichtung"))} ${esc(e.dir)}</span>` : ""}${e.temp ? `<span>${esc(T("temperature", "Wassertemperatur"))}: ${esc(e.temp)}</span>` : ""}</div>
      ${Object.keys(e.detail).map(k => `<div class="ev-det"><b>${esc(T(DET[k] || k, k))}:</b> ${esc(e.detail[k])}${e.fromImage && (k === "baitDetail" || k === "dip") ? ` <span class="fromimg">${esc(T("fromImage", "aus Bild"))}</span>` : ""}${e.record && k === "baitDetail" ? ` <span class="fromimg" title="${esc(e.record.table + " · " + e.record.region + " · " + e.record.date)}">${esc(T("fromRecords", "laut Rekordliste"))} · ${esc(e.record.table)} ${esc(e.record.region)}</span>` : ""}</div>`).join("")}
      <div class="ev-src">${e.sources.map(s => s.url ? `<button class="src" data-url="${esc(s.url)}" title="${esc(s.members ? T("discordMembers", "Nur für Mitglieder des Discord-Servers sichtbar") : "")}">${esc(s.label)}${s.members ? " · " + esc(T("membersOnly", "nur Mitglieder")) : ""} ↗</button>${s.invite ? `<button class="src" data-url="${esc(s.invite)}">${esc(T("joinServer", "Server beitreten"))} ↗</button>` : ""}` : `<span class="src off" title="${esc(s.members ? T("discordMembers", "Nur für Mitglieder des Discord-Servers sichtbar") : "")}">${esc(s.label)}${s.members ? " · " + esc(T("membersOnly", "nur Mitglieder")) : ""}</span>${s.invite ? `<button class="src" data-url="${esc(s.invite)}">${esc(T("joinServer", "Server beitreten"))} ↗</button>` : ""}`).join("")}</div>
      ${e.postText ? `<details class="orig"><summary>${esc(T("origText", "Originaltext"))}</summary><div lang="ru" translate="yes">${esc(e.postText)}</div><small>${esc(T("translateHint", "Zum Übersetzen Text markieren, Rechtsklick, Übersetzen."))}</small></details>` : ""}
      ${e.imgPost && e.imgCount !== 0 ? `<div class="thumbs" data-post="${esc(e.imgPost)}" data-n="${e.imgCount}"></div>` : ""}
    </div>`).join("");
  document.querySelectorAll("#detail .src[data-url]").forEach(b => b.onclick = () => api("/api/open", { url: b.dataset.url }));
  document.querySelectorAll("#detail .thumbs").forEach(th => {
    const n = +th.dataset.n, cnt = n > 0 ? Math.min(n, 4) : 2;
    for (let i = 0; i < cnt; i++) {
      const im = document.createElement("img"); im.loading = "lazy";
      im.src = "/img/tg?p=" + encodeURIComponent(th.dataset.post) + "&i=" + i + "&t=" + TOKEN;
      im.onerror = () => im.remove();
      im.onclick = () => { $("lbImg").src = im.src; $("lightbox").classList.add("show"); };
      th.appendChild(im);
    }
  });
}
const DET = { baitDetail: "baitExact", lure: "lureDetail", rig: "rigL", dip: "dipL", groundbait: "groundbaitMix", dryMix: "dryMix", pva: "pvaL", reelSpeed: "reelSpeed" };
$("lightbox").onclick = () => $("lightbox").classList.remove("show");
(function mapInput() {
  const cv = $("map"); let drag = null;
  cv.addEventListener("wheel", e => { e.preventDefault(); const f = e.deltaY < 0 ? 1.2 : 1 / 1.2; VIEW.zoom = Math.max(1, Math.min(8, VIEW.zoom * f)); drawMap(); }, { passive: false });
  cv.addEventListener("mousedown", e => { drag = { x: e.clientX, y: e.clientY, cx: VIEW.cx, cy: VIEW.cy, moved: false }; cv.style.cursor = "grabbing"; });
  window.addEventListener("mouseup", e => {
    const d = drag; drag = null; cv.style.cursor = "grab";
    if (!d || d.moved || e.target !== cv) return;
    const r = cv.getBoundingClientRect(), m = markAt(e.clientX-r.left, e.clientY-r.top);
    if (!m) return;
    SEL = m.key; renderCards(); drawMap(); loadDetail();
    const card = document.querySelector('.card[data-key="' + CSS.escape(m.key) + '"]');
    if (card) card.scrollIntoView({ block: "nearest", behavior: "smooth" });
  });
  cv.addEventListener("mousemove", e => { if (drag) return; const r = cv.getBoundingClientRect(); cv.style.cursor = markAt(e.clientX-r.left, e.clientY-r.top) ? "pointer" : "grab"; });
  window.addEventListener("mousemove", e => { if (!drag) return; if (Math.hypot(e.clientX-drag.x, e.clientY-drag.y) > 4) drag.moved = true; if (!drag.moved) return; const side = Math.min(cv.clientWidth, cv.clientHeight) * VIEW.zoom; VIEW.cx = drag.cx-(e.clientX-drag.x) / side; VIEW.cy = drag.cy-(e.clientY-drag.y) / side; drawMap(); });
  window.addEventListener("resize", drawMap);
})();
document.querySelectorAll(".nav-btn").forEach(b => b.onclick = () => showView(b.dataset.view));
$("hoursSeg").querySelectorAll("button").forEach(b => b.onclick = () => { HOURS = +b.dataset.h; $("hoursSeg").querySelectorAll("button").forEach(x => x.classList.toggle("on", x === b)); loadActive(); });
$("lakeSel").onchange = () => { LAKE = $("lakeSel").value; SEL = null; loadActive(); };
$("allChk").onchange = () => loadActive();
$("syncBtn").onclick = () => api("/api/sync", {}).then(ping);
$("lang").onchange = async () => { INIT = await api("/api/lang", { lang: $("lang").value }); S = INIT.strings; fillLakes(); applyStrings(); findStatic(); loadActive(); loadFind(); };
$("updBtn").onclick = () => { $("updBtn").disabled = true; api("/api/update", {}).catch(e => { alert(e.message); $("updBtn").disabled = false; }); };
let FIND = { fish: "", lake: "", region: "", table: "", win: "week", q: "" }, FDATA = null, FSEQ = 0;
function findStatic() {

  w[1].textContent = T("prefWinHours", "Erste {0} Std. nach Reset").replace("{0}", 24);

}
async function loadFind() {

  let d;
  try { d = await api("/api/find?" + qs); } catch (e) { return; }

  renderFindDetail();
}
function renderFindFilters() {

    : T("resetNotYet", "Der Wochenreset ist noch nicht erfasst.");

function renderFishList() {
  const d = FDATA, q = FIND.q.toLowerCase();

    (list.length ? list.map(f => `<div class="fish-row ${f.key === FIND.fish ? "sel" : ""}" data-k="${esc(f.key)}"><span>${esc(f.name)}</span><span class="n">${f.n.toLocaleString(INIT.lang)}</span></div>`).join("") : `<div class="empty">${esc(T("findNoFish", "Kein Fisch gefunden."))}</div>`);

  $("baitHits").innerHTML = s.length ? `<div class="hdr">${esc(T("prefBaitSearch", "Köder suchen"))}</div><table class="tbl"><tr><th>${esc(T("bait", "Köder"))}</th><th class="num">${esc(T("records", "Rekorde"))}</th><th class="num">48 h</th></tr>` +
    s.slice(0, 12).map(b => `<tr><td>${esc(b.name)}<small>${esc(b.fish.slice(0, 8).join(", "))}${b.fish.length > 8 ? " …" : ""}</small></td><td class="num">${b.n}</td><td class="num">${b.n48}</td></tr>`).join("") + `</table>` : "";
}
function renderFindDetail() {
  const d = FDATA, el = $("findDetail");

  const top = d.baits.length ? d.baits[0].name : "";

    d.baits.map(b => `<tr><td>${esc(b.name)}${d.fish === "grp:koi" || b.fish.length > 1 ? `<small>${esc(b.fish.join(", "))}</small>` : ""}</td><td class="num">${b.n}</td><td class="num">${b.n48}</td></tr>`).join("") + `</table>` : `<div class="empty">${esc(T("findNoBaits", "Keine Rekorde an diesem Gewässer in der Auswahl."))}</div>`;
  const spots = d.spots.length ? `<div class="mini-cards">${d.spots.map(s => `<div class="mini" data-k="${esc(s.key)}"><div class="top">${esc(s.name)}<span>${esc(ago(s.hoursAgo))}</span></div><div class="b">${esc(s.baits.join(", ") || T("catchesN", "{0} Fänge").replace("{0}", s.catches))}</div></div>`).join("")}</div>` : `<div class="empty" style="padding:14px">${esc(T("findNoSpots", "In den letzten 3 Tagen keine Spotmeldung mit Köder für diesen Fisch hier."))}</div>`;
  const recs = d.records.length ? `<table class="tbl"><tr><th>${esc(T("fish", "Fisch"))}</th><th class="num">${esc(T("weight", "Gewicht"))}</th><th>${esc(T("bait", "Köder"))}</th><th>${esc(T("date", "Datum"))}</th><th>${esc(T("resetTable", "Tabelle"))}</th></tr>` +
    d.records.slice(0, 30).map(r => `<tr><td>${esc(r.fish)}</td><td class="num">${esc(r.weight)}</td><td>${esc(r.bait)}</td><td>${esc(r.date)}</td><td>${esc(r.table)}${r.region ? " · " + esc(r.region) : ""}</td></tr>`).join("") + `</table>` : "";
  el.innerHTML = `<div class="title-row"><h2>${esc(d.fishName)}</h2></div>
    <p class="sub">${d.n ? esc(T("tgtWeekRecords", "Diese Woche {0} Rekorde, davon {1} in den letzten 48 Stunden. Meistgenutzt: {2}").replace("{0}", d.n).replace("{1}", d.n48).replace("{2}", top)) : ""}</p>
    ${lakes}
    ${notes.map(n => `<div class="note">${esc(n)}</div>`).join("")}
    <div class="hdr">${esc(T("tgtBaits", "Köder aus den Rekorden"))} · ${esc(d.lakeName)}</div>${baits}

    ${recs ? `<div class="hdr">${esc(T("findTopRecords", "Größte Rekorde"))} · ${esc(d.lakeName)}</div>${recs}` : ""}`;
  el.querySelectorAll(".chip[data-l]").forEach(c => c.onclick = () => { FIND.lake = c.dataset.l; loadFind(); });
  el.querySelectorAll(".mini[data-k]").forEach(c => c.onclick = () => goSpot(d.lake, c.dataset.k));

function showView(v) {

let FQT = 0;
$("findQ").oninput = () => { FIND.q = $("findQ").value.trim(); if (FDATA) renderFishList(); clearTimeout(FQT); FQT = setTimeout(loadFind, 300); };

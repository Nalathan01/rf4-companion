<html lang="de" translate="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RF4 Companion</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%234fa8c9'/%3E%3Cpath d='M6 17c4-6 12-7 17-1l3-3v8l-3-3c-5 6-13 5-17-1z' fill='%2306202b'/%3E%3C/svg%3E">
<style>
:root {
  color-scheme: dark;
  --bg: #111315;
  --rail: #16181b;
  --surface: #1b1e21;
  --surface-2: #22262a;
  --surface-3: #2a2f34;
  --line: #2c3136;
  --line-soft: #23272b;
  --ink: #f0efec;
  --ink-2: #c3c2b7;
  --muted: #8a8d88;
  --accent: #4fa8c9;
  --accent-hover: #67b9d7;
  --accent-soft: rgba(79, 168, 201, 0.14);
  --accent-ink: #06202b;
  --hot: #e0803a;
  --warm: #d8b24a;
  --cold: #5f625d;
  --radius: 14px;
  --font: "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
  --font-display: "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif;
  --mono: "Cascadia Mono", Consolas, monospace;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 14px; line-height: 1.45; display: flex; flex-direction: column; overflow: hidden; }
button, input, select { font: inherit; color: inherit; }
::selection { background: var(--accent); color: var(--accent-ink); }
::-webkit-scrollbar { width: 12px; height: 12px; }
::-webkit-scrollbar-thumb { background: var(--surface-3); border-radius: 8px; border: 3px solid transparent; background-clip: padding-box; }
::-webkit-scrollbar-track { background: transparent; }

header { display: flex; align-items: center; gap: 18px; padding: 14px 22px; border-bottom: 1px solid var(--line-soft); background: var(--rail); }
.brand { display: flex; align-items: center; gap: 11px; min-width: 210px; }
.brand-mark { width: 34px; height: 34px; border-radius: 10px; background: linear-gradient(145deg, #74c3e0, #2f86a7); display: grid; place-items: center; box-shadow: 0 6px 18px rgba(79,168,201,0.25), inset 0 1px 0 rgba(255,255,255,0.3); }
.brand h1 { font-family: var(--font-display); font-size: 16px; font-weight: 650; margin: 0; }
.brand p { margin: 0; font-size: 11.5px; color: var(--muted); }
nav { display: flex; gap: 6px; flex: 1; justify-content: center; }
.nav-btn { border: 1px solid transparent; background: transparent; border-radius: 999px; padding: 8px 18px; cursor: pointer; color: var(--ink-2); font-weight: 600; }
.nav-btn:hover { background: var(--surface); color: var(--ink); }
.nav-btn.active { background: var(--accent-soft); border-color: rgba(79,168,201,0.5); color: var(--ink); }
.head-acts { display: flex; align-items: center; gap: 8px; min-width: 210px; justify-content: flex-end; }
.icon-btn { width: 36px; height: 36px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); display: grid; place-items: center; cursor: pointer; color: var(--ink-2); }
.icon-btn:hover { color: var(--ink); border-color: var(--surface-3); }
.upd { display: none; align-items: center; gap: 8px; background: var(--accent-soft); border: 1px solid rgba(79,168,201,0.4); border-radius: 999px; padding: 5px 6px 5px 12px; font-size: 12.5px; }
.upd.show { display: flex; }

.btn { border: 1px solid var(--line); background: var(--surface-2); border-radius: 10px; padding: 7px 14px; cursor: pointer; font-weight: 600; }
.btn.alert { background: #c0392b; border-color: #c0392b; color: #fff; }
#gBackupState:empty { display: none; }
.rep-post { margin: 8px 0 4px; padding: 8px 10px; border-left: 3px solid var(--line); background: var(--surface-2); border-radius: 6px; }
.rep-post small { color: var(--muted); margin-left: 4px; }
.rep-post .thumbs img { height: 60px; cursor: zoom-in; }
.rate-bar { margin-top: 10px; display: flex; flex-wrap: wrap; gap: 8px; }
.rate-bar .btn.on { background: var(--accent); border-color: var(--accent); color: #111; }
.rate-bar .btn span { opacity: 0.8; margin-left: 2px; }
.adm-bar { margin-top: 10px; padding: 8px 10px; border: 1px dashed #c0392b; border-radius: 10px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.adm-bar b { color: #e0604f; font-size: 12px; text-transform: uppercase; letter-spacing: 0.5px; margin-right: 4px; }
.adm-bar .btn { border-color: #c0392b; }
.btn:hover { border-color: var(--surface-3); background: var(--surface-3); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { background: var(--accent-hover); }
.btn.small { padding: 4px 10px; font-size: 12.5px; border-radius: 8px; }
.shot { grid-column: 1 / 3; background: var(--accent-soft); border: 1px solid rgba(79,168,201,0.5); border-radius: 12px; padding: 12px 14px; }
.shot-now { font-size: 15px; color: var(--ink); }
.shot-why { margin-top: 6px; color: #e8b86a; font-size: 13px; }
.shot-wait { margin-top: 6px; color: var(--muted); font-size: 12px; }
.shot .btn { margin-top: 8px; }
.wiz-head { grid-column: 1 / 3; display: flex; flex-wrap: wrap; gap: 6px; }
.wiz-head span { font-size: 12px; padding: 4px 10px; border-radius: 999px; background: var(--surface-2); color: var(--muted); }
.wiz-head span.on { background: var(--accent); color: var(--accent-ink); font-weight: 650; }
.wiz-head span.done { background: var(--accent-soft); color: var(--ink); }
.wiz-hint { grid-column: 1 / 3; margin: 2px 0 4px; color: var(--ink-2); font-size: 14px; }
.wiz-nav { grid-column: 1 / 3; display: flex; justify-content: space-between; margin-top: 8px; }
.wiz-sum { grid-column: 1 / 3; background: var(--bg); border: 1px solid var(--line); border-radius: 9px; padding: 10px 12px; font-size: 13px; line-height: 1.6; }
.log-start { text-align: center; padding: 70px 20px; border: 1px dashed var(--line); border-radius: 16px; margin-top: 10px; }
.log-start p { color: var(--ink-2); font-size: 15px; margin: 0 0 18px; }
.btn.big { padding: 10px 22px; font-size: 15px; border-radius: 12px; box-shadow: 0 4px 14px rgba(79,168,201,0.35); }

main { flex: 1; min-height: 0; display: flex; }
.view { flex: 1; min-height: 0; display: none; }
.view.active { display: flex; }

.split { display: grid; grid-template-columns: minmax(420px, 1fr) minmax(420px, 1.1fr); width: 100%; min-height: 0; }
.col { min-height: 0; overflow-y: auto; padding: 22px 24px; }
.col.map-col { padding: 22px 24px 22px 0; display: flex; flex-direction: column; }
.title-row { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 4px; }
.title-row h2 { font-family: var(--font-display); font-size: 26px; margin: 0; font-weight: 700; letter-spacing: -0.3px; }
.sub { color: var(--muted); font-size: 13px; margin: 0 0 16px; }
.filters { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
.chk { display: inline-flex; align-items: center; gap: 6px; color: var(--ink-2); font-size: 13px; cursor: pointer; padding: 0 4px; }
.chk input { accent-color: var(--accent); width: 15px; height: 15px; }
.seg { display: inline-flex; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 3px; }
.seg button { border: 0; background: transparent; padding: 5px 12px; border-radius: 7px; cursor: pointer; color: var(--ink-2); font-weight: 600; font-size: 13px; }
.seg button.on { background: var(--surface-3); color: var(--ink); }
select { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 6px 10px; min-width: 200px; }

.cards { display: flex; flex-direction: column; gap: 10px; }
.card { background: var(--surface); border: 1px solid var(--line-soft); border-radius: var(--radius); padding: 13px 15px; cursor: pointer; display: grid; grid-template-columns: 14px 1fr auto; gap: 4px 12px; transition: border-color 0.15s, background 0.15s; }
.card:hover { border-color: var(--line); background: var(--surface-2); }
.card.sel { border-color: rgba(79,168,201,0.65); box-shadow: inset 3px 0 0 var(--accent); }
.dot { width: 11px; height: 11px; border-radius: 50%; margin-top: 6px; background: var(--cold); }
.dot.hot { background: var(--hot); box-shadow: 0 0 0 4px rgba(224,128,58,0.18); }
.dot.warm { background: var(--warm); }
.card .where { font-weight: 650; font-size: 15px; }
.card .where small { color: var(--muted); font-weight: 500; font-size: 13px; margin-left: 6px; }
.card .ago { color: var(--ink-2); font-size: 12.5px; text-align: right; white-space: nowrap; }
.card .line { grid-column: 2 / 4; color: var(--ink-2); font-size: 13px; }
.card .meta { grid-column: 2 / 4; color: var(--muted); font-size: 12px; display: flex; flex-wrap: wrap; gap: 6px 12px; }
.tag { display: inline-block; background: var(--surface-3); border-radius: 6px; padding: 1px 7px; margin: 0 4px 2px 0; font-size: 12.5px; color: var(--ink); }
.tag.b { background: rgba(79,168,201,0.16); }
.src.adopt { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 650; }
.empty { color: var(--muted); padding: 30px 10px; text-align: center; }

.mapbox { position: relative; flex: 1; min-height: 0; background: var(--surface); border: 1px solid var(--line-soft); border-radius: var(--radius); overflow: hidden; }
.mapbox canvas { position: absolute; inset: 0; width: 100%; height: 100%; cursor: grab; }
.mapbox .maplabel { position: absolute; left: 12px; top: 10px; background: rgba(17,19,21,0.78); border-radius: 8px; padding: 4px 10px; font-weight: 650; font-size: 13px; }
.mapbox .maptool { position: absolute; right: 12px; top: 10px; background: rgba(17,19,21,0.78); }
.mapbox .maptool.on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.mapbox .maphint { position: absolute; left: 12px; bottom: 10px; background: rgba(17,19,21,0.78); border-radius: 8px; padding: 3px 9px; font-size: 12px; color: var(--muted); }

.detail { flex: 1; min-height: 0; overflow-y: auto; margin-top: 14px; }
.map-col .mapbox { flex: 1.15; }
.d-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin: 2px 2px 10px; }
.d-head h3 { margin: 0; font-family: var(--font-display); font-size: 19px; }
.d-head .d-sum { color: var(--muted); font-size: 12.5px; }
.ev { background: var(--surface); border: 1px solid var(--line-soft); border-radius: 12px; padding: 11px 13px; margin-bottom: 9px; }
.ev-top { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; }
.ev-fish { font-weight: 650; }
.ev-fish .w { color: var(--accent); margin-left: 6px; font-weight: 600; }
.ev-time { color: var(--muted); font-size: 12px; white-space: nowrap; }
.ev-facts { display: flex; flex-wrap: wrap; gap: 4px 14px; color: var(--ink-2); font-size: 12.5px; margin-top: 4px; }
.ev-det { font-size: 12.5px; color: var(--ink-2); margin-top: 5px; }
.ev-det b { color: var(--muted); font-weight: 600; }
.ev-src { margin-top: 7px; display: flex; flex-wrap: wrap; gap: 6px; }
.src { font-size: 12px; border: 1px solid var(--line); border-radius: 999px; padding: 2px 9px; color: var(--ink-2); background: transparent; cursor: pointer; }
.src:hover { color: var(--ink); border-color: var(--accent); }
.src.off { cursor: default; opacity: 0.7; border-style: dashed; }
.src.off:hover { border-color: var(--line); color: var(--ink-2); }
.fromimg { font-size: 11px; color: var(--accent); border: 1px solid rgba(79,168,201,0.4); border-radius: 6px; padding: 0 5px; margin-left: 4px; }
.orig { margin-top: 7px; font-size: 12.5px; }
.orig summary { cursor: pointer; color: var(--muted); }
.orig summary:hover { color: var(--ink-2); }
.orig div { white-space: pre-wrap; background: var(--surface-2); border-radius: 8px; padding: 8px 10px; margin-top: 5px; color: var(--ink-2); }
.orig small { display: block; color: var(--muted); margin-top: 4px; }
.cc { font-size: 10px; font-weight: 700; letter-spacing: .04em; color: var(--muted); }
.thumbs { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
.thumbs img { height: 74px; border-radius: 8px; border: 1px solid var(--line); cursor: zoom-in; background: var(--surface-2); }
.lightbox { padding: 0; border: 0; background: transparent; width: 100vw; height: 100vh; max-width: none; max-height: none; cursor: zoom-out; }
.lightbox[open] { display: grid; place-items: center; }
.ac-box { position: fixed; z-index: 1000; max-height: 280px; overflow-y: auto; background: var(--surface-2); border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 8px 24px rgba(0,0,0,0.45); }
.ac-item { padding: 7px 12px; font-size: 13px; color: var(--ink); cursor: pointer; white-space: normal; }
.ac-item:hover, .ac-item.on { background: var(--accent-soft); color: var(--accent-hover); }
.lightbox::backdrop { background: rgba(0,0,0,0.85); }
.lightbox img { width: 94vw; height: 92vh; object-fit: contain; border-radius: 10px; transform-origin: center; cursor: grab; user-select: none; -webkit-user-drag: none; }
.fbimg img { cursor: zoom-in; }
.fbimg .rp { position: absolute; top: 2px; left: 2px; background: rgba(0,0,0,0.6); border: 0; border-radius: 6px; color: var(--ink); cursor: pointer; font-size: 11px; padding: 1px 5px; }
.mini .thumbs img { height: 46px; }
.placeholder { margin: auto; text-align: center; color: var(--muted); max-width: 520px; }
.placeholder h2 { color: var(--ink); font-family: var(--font-display); }
.status { position: fixed; right: 16px; bottom: 14px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; padding: 6px 12px; font-size: 12.5px; color: var(--ink-2); display: none; }
.status.show { display: block; }
.find-split { grid-template-columns: minmax(340px, 0.75fr) minmax(520px, 1.6fr); }
.search { width: 100%; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 9px 12px; margin-bottom: 10px; outline: none; }
.search:focus { border-color: var(--accent); }
.banner { display: none; background: rgba(224,128,58,0.12); border: 1px solid rgba(224,128,58,0.45); border-radius: 12px; padding: 10px 13px; margin-bottom: 12px; font-size: 13px; color: var(--ink); }
.banner.show { display: block; }
.fish-list { display: flex; flex-direction: column; gap: 2px; }
.fish-row { display: flex; justify-content: space-between; gap: 10px; padding: 7px 11px; border-radius: 9px; cursor: pointer; color: var(--ink-2); }
.fish-row:hover { background: var(--surface); color: var(--ink); }
.fish-row.sel { background: var(--accent-soft); color: var(--ink); box-shadow: inset 3px 0 0 var(--accent); }
.fish-row .n { color: var(--muted); font-variant-numeric: tabular-nums; font-size: 12.5px; }
.hdr { color: var(--muted); font-size: 11.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.6px; margin: 18px 2px 8px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 5px 12px; cursor: pointer; font-size: 13px; color: var(--ink-2); }
.chip:hover { color: var(--ink); border-color: var(--surface-3); }
.chip.on { background: var(--accent-soft); border-color: rgba(79,168,201,0.6); color: var(--ink); }
.chip .n { color: var(--muted); margin-left: 6px; font-size: 12px; }
.tbl { width: 100%; border-collapse: collapse; font-size: 13px; }
.tbl th { text-align: left; color: var(--muted); font-weight: 600; font-size: 12px; padding: 6px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.tbl th.sortable { cursor: pointer; user-select: none; }
.tbl th.sortable:hover { color: var(--ink); }
.tbl td { padding: 7px 8px; border-bottom: 1px solid var(--line-soft); color: var(--ink-2); vertical-align: top; }
.tbl td:first-child { color: var(--ink); }
.tbl td.num, .tbl th.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.tbl td small { display: block; color: var(--muted); font-size: 11.5px; margin-top: 2px; }
.note { color: var(--ink-2); font-size: 13px; background: var(--surface); border: 1px solid var(--line-soft); border-radius: 12px; padding: 10px 13px; margin-top: 10px; }
.mini-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 8px; }
.mini { background: var(--surface); border: 1px solid var(--line-soft); border-radius: 12px; padding: 10px 12px; cursor: pointer; }
.mini:hover { border-color: rgba(79,168,201,0.6); }
.mini .top { display: flex; justify-content: space-between; gap: 8px; font-weight: 650; }
.mini .top span { color: var(--muted); font-weight: 500; font-size: 12px; }
.mini .b { color: var(--ink-2); font-size: 12.5px; margin-top: 4px; }
.trk { background: var(--surface); border: 1px solid var(--line-soft); border-radius: var(--radius); padding: 13px 15px; margin-bottom: 16px; }
.trk-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.trk-head b { font-size: 15px; margin-right: 4px; }
.trk-msg { color: var(--ink-2); font-size: 12.5px; flex: 1; min-width: 200px; }
.trk-msg small { color: var(--muted); margin-right: 6px; }
.trk-info { display: flex; flex-wrap: wrap; gap: 6px 16px; color: var(--ink-2); font-size: 12.5px; margin-top: 9px; align-items: center; }
.trk-info b { color: var(--muted); font-weight: 600; }
.trk-info input { width: 64px; background: var(--bg); border: 1px solid var(--line); border-radius: 7px; padding: 2px 7px; color: var(--ink); }
.switch { position: relative; width: 38px; height: 21px; flex: none; }
.switch input { opacity: 0; width: 0; height: 0; }
.switch span { position: absolute; inset: 0; background: var(--surface-3); border-radius: 999px; cursor: pointer; transition: background .15s; }
.switch span::after { content: ""; position: absolute; left: 3px; top: 3px; width: 15px; height: 15px; border-radius: 50%; background: var(--ink-2); transition: transform .15s; }
.switch input:checked + span { background: var(--accent); }
.switch input:checked + span::after { transform: translateX(17px); background: #fff; }
.tbl tr.repl td { background: var(--accent-soft); }
.tbl select { background: var(--bg); border: 1px solid var(--line); border-radius: 7px; padding: 2px 6px; min-width: 0; font-size: 12.5px; }
.pend-wrap { max-height: 260px; overflow-y: auto; }
.log-split { grid-template-columns: minmax(480px, 1.5fr) minmax(380px, 1fr); }
.grp { background: var(--surface); border: 1px solid var(--line-soft); border-radius: var(--radius); padding: 12px 15px; }
.grp-head { display: flex; justify-content: space-between; gap: 10px; cursor: pointer; align-items: baseline; }
.grp-head b { font-size: 14.5px; }
.grp-head b small { color: var(--muted); font-weight: 500; margin-left: 6px; font-size: 12.5px; }
.grp-head span { color: var(--muted); font-size: 12.5px; white-space: nowrap; }
.grp .line { margin-top: 6px; }
.grp .rows { display: none; margin-top: 10px; }
.grp.open .rows { display: block; }
.act { background: none; border: 0; color: var(--muted); cursor: pointer; padding: 0 4px; font-size: 14px; }
.act:hover { color: var(--ink); }
dialog { background: var(--surface); color: var(--ink); border: 1px solid var(--line); border-radius: 16px; padding: 20px 22px; width: min(640px, 92vw); }
dialog::backdrop { background: rgba(0,0,0,0.6); }
dialog h3 { margin: 0 0 14px; font-family: var(--font-display); font-size: 19px; }
.form { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 14px; }
.form label { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--muted); }
.form label.wide { grid-column: 1 / 3; }
.form label.chk { flex-direction: row; align-items: center; gap: 8px; font-size: 13px; color: var(--ink-2); }
.form label.chk input { width: 16px; height: 16px; padding: 0; flex: none; }
.form label.ovrow { grid-column: 1 / 3; }
.form input[type=color] { height: 34px; padding: 3px; cursor: pointer; }
.form input[type=range] { padding: 0; border: none; background: none; accent-color: var(--accent); }
.ovsec { grid-column: 1 / 3; margin: 12px 0 0; padding-top: 10px; border-top: 1px solid var(--line); font-size: 13px; font-weight: 700; color: var(--ink); }
.ovprev { grid-column: 1 / 3; width: 100%; height: 240px; border: 1px solid var(--line); border-radius: 10px; background: repeating-conic-gradient(#2a2f34 0% 25%, #1b1e21 0% 50%) 50% / 20px 20px; }
.form input, .form select { background: var(--bg); border: 1px solid var(--line); border-radius: 9px; padding: 7px 10px; min-width: 0; color: var(--ink); font-size: 13.5px; }
.form input:focus, .form select:focus, .form textarea:focus { outline: none; border-color: var(--accent); }
.form textarea { background: var(--bg); border: 1px solid var(--line); border-radius: 9px; padding: 7px 10px; color: var(--ink); font: inherit; font-size: 13.5px; resize: vertical; min-height: 64px; }
.fbimgs { grid-column: 1 / 3; display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; }
.fbimg { position: relative; aspect-ratio: 4 / 3; background: var(--bg); border: 1px dashed var(--line); border-radius: 9px; cursor: pointer; overflow: hidden; display: flex; align-items: center; justify-content: center; color: var(--muted); font-size: 20px; }
.fbimg:hover { border-color: var(--accent); }
.fbimg img { width: 100%; height: 100%; object-fit: cover; }
.fbimg small { position: absolute; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.55); color: var(--ink); font-size: 10.5px; text-align: center; padding: 1px 2px; }

<script>
const TOKEN = new URLSearchParams(location.search).get("t") || "";
const PAGE = Math.random().toString(36).slice(2);
addEventListener("pagehide", () => { try { navigator.sendBeacon("/api/bye?t=" + TOKEN + "&pg=" + PAGE); } catch (e) { } });
let OCRV = -1;
let S = {}, INIT = null, ACTIVE = [], HOURS = 24, LAKE = "", SEL = null, DATAV = -1;
const $ = id => document.getElementById(id);
function T(k, fb) { return (S[k] != null && S[k] !== "") ? S[k] : (fb != null ? fb : k); }
document.addEventListener("error", ev => {
  const t = ev.target;
  if (t && t.tagName === "IMG" && !t.dataset.fb && t.src.startsWith("https://rf4-share.rf4-companion.workers.dev/d/")) {
    t.dataset.fb = "1";
    t.src = "https://raw.githubusercontent.com/Nalathan01/rf4-companion-data/" + t.src.slice(46);
  }
}, true);
async function api(path, body) {
  const r = await fetch(path + (path.includes("?") ? "&" : "?") + "t=" + TOKEN + "&pg=" + PAGE, body === undefined ? {} : { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
  const j = await r.json();
  if (!r.ok) throw new Error(j.error + (j.arg ? ": " + j.arg : ""));
  return j;
}
function errText(e) { const c = String(e.message || "").split(":")[0].trim(); return T(c, e.message); }
function esc(s) { return String(s == null ? "" : s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }
function ago(h) {
  if (h < 1) return T("agoMinutes", "vor {0} Min.").replace("{0}", Math.max(1, Math.round(h * 60)));
  if (h < 48) return T("agoHours", "vor {0} Std.").replace("{0}", Math.round(h));
  return T("agoDays", "vor {0} Tagen").replace("{0}", Math.round(h / 24));
}
function applyStrings() {
  document.querySelectorAll("[data-t]").forEach(el => { const k = el.getAttribute("data-t"); if (S[k]) el.textContent = S[k]; });
  $("gear").title = T("settings", "Einstellungen");
  document.documentElement.lang = INIT.lang;
}
async function boot() {
  const BOOT = { bootGame: "Spieldaten werden geladen", bootData: "Meldungen werden geladen", bootSync: "Neue Meldungen werden abgeglichen", bootPosts: "Beiträge und Bilder werden gelesen", bootSpots: "Spots werden ausgewertet", bootRecords: "Rekordlisten werden geladen", bootFinish: "Fast fertig" };
  const until = Date.now() + 600000;
  while (Date.now() < until) {
    try {
      const p = await api("/api/ping");
      if (p.ready && !INIT) { INIT = await api("/api/init"); S = INIT.strings; }
      $("bootBar").style.width = (p.started ? 100 : p.stepPct || 0) + "%";
      if (p.step) $("bootStep").textContent = T(p.step, BOOT[p.step] || "") + (p.stepInfo ? " · " + p.stepInfo : "");
      if (p.started) break;
    } catch (e) {}
    await new Promise(r => setTimeout(r, 200));
  }
  if (!INIT) INIT = await api("/api/init");
  S = INIT.strings;
  $("ver").textContent = "Version " + INIT.version;
  document.title = "RF4 Companion " + INIT.version;
  loadBrowsers();
  $("lang").innerHTML = INIT.langs.map(l => `<option value="${l}" ${l === INIT.lang ? "selected" : ""}>${l.toUpperCase()}</option>`).join("");
  fillLakes();
  applyStrings();
  findStatic();
  histStatic();
  await loadActive();
  loadFind();
  loadReports();
  ctaState();
  document.documentElement.classList.toggle("nolog", !INIT.features.log);
  document.documentElement.classList.toggle("notrk", !INIT.features.tracker);
  document.documentElement.classList.toggle("nohist", !INIT.features.history);
  document.documentElement.classList.toggle("noov", !INIT.features.overlay);
  loadLog();
  trk("status");
  loadExtensions();
  const hv = location.hash.slice(1).split("=");
  if (hv[0] === "find" || hv[0] === "log" || (hv[0] === "hist" && INIT.features.history)) { showView(hv[0]); if (hv[0] === "find" && hv[1]) { FIND.fish = decodeURIComponent(hv[1]); loadFind(); } }
  if (hv[0] === "menu" && MENU[hv[1]]) MENU[hv[1]]();
  if (hv[0] === "share" && !INIT.features.share) shareCtaDlg();
  if (hv[0] === "reports" && INIT.features.admin) loadReports().then(reportsSheet);
  $("boot").classList.add("hide");
  setTimeout(() => $("boot").remove(), 400);
  setInterval(ping, 5000);
}
function fillLakes() {
  $("lakeSel").innerHTML = `<option value="">${esc(T("allLakes", "Alle Gewässer"))}</option>` + INIT.lakes.filter(l => l.map).map(l => `<option value="${l.id}" ${l.id === LAKE ? "selected" : ""}>${esc(l.name)}</option>`).join("");
}
let GONE = 0;
function appGone() {
  try { window.close(); } catch (e) { }
  if ($("goneOv")) return;
  const o = document.createElement("div");
  o.id = "goneOv";
  o.style.cssText = "position:fixed;inset:0;z-index:9999;background:rgba(10,14,18,.92);display:flex;align-items:center;justify-content:center;text-align:center;padding:16px;font-size:18px";
  o.textContent = T("appEnded", "RF4 Companion wurde beendet. Dieses Fenster kann geschlossen werden.");
  document.body.appendChild(o);
}
async function ping() {
  try {
    const p = await api("/api/ping");
    GONE = 0;
    if (p.updPct >= 0 && p.updPct < 100) updOverlay(p.updPct, T("updDownloading", "Update wird geladen: {0} %").replace("{0}", p.updPct));
    if (p.updPct >= 100) updOverlay(100, T("updRestarting", "Neustart: Das neue Fenster öffnet sich gleich."));
    if (p.updErr && p.updErr !== UPD_ERR) { UPD_ERR = p.updErr; if ($("updOv")) $("updOv").remove(); alert(T("updFailed", "Update fehlgeschlagen: {0}").replace("{0}", p.updErr)); }
    if (p.update) { $("upd").classList.add("show"); $("updText").textContent = T("updateAvailable", "Version {0} ist verfügbar").replace("{0}", p.update); }
    $("status").classList.toggle("show", !!p.syncing);
    if (p.syncing) $("status").textContent = T("syncing", "Wird abgeglichen") + (p.syncState ? " · " + p.syncState : "");
    if (DATAV !== -1 && p.data !== DATAV) loadActive();
    DATAV = p.data;
    if (OCRV !== -1 && p.ocr !== OCRV) { DETAIL_KEY = null; loadActive(); }
    OCRV = p.ocr;
    if (p.tracker !== TRKV) { TRKV = p.tracker; trk("status"); }
    if (p.spot) openSpotKey(p.spot);
  } catch (e) { if (e instanceof TypeError && ++GONE >= 3) appGone(); }
}
async function loadActive() {
  if ($("ownChk").checked && !LOG) await loadLog();
  const r = await api("/api/active?hours=" + HOURS + "&lake=" + encodeURIComponent(LAKE) + ($("allChk").checked ? "&all=1" : "") + actParams());
  ACTIVE = ownOnly() ? [] : r.spots;
  if (ownOnly()) $("activeSub").textContent = T("ownSpotsN", "{0} eigene Spots").replace("{0}", ownList().length);
  else $("activeSub").textContent = T("activeSub", "{0} Spots mit Meldungen in diesem Zeitraum").replace("{0}", ACTIVE.length) + (r.synced ? " · " + T("lastSync", "Stand") + " " + new Date(r.synced).toLocaleTimeString(INIT.lang, { hour: "2-digit", minute: "2-digit" }) : "");
  if (ownOnly()) { const mine = ownList(); if (!ownSel()) SEL = mine.length ? "own:" + mine[0].id : null; }
  else if (!SEL || (!ACTIVE.find(s => s.key === SEL) && !ownSel())) SEL = ACTIVE.length ? ACTIVE[0].key : null;
  renderCards();
  drawMap();
  DETAIL_KEY = null;
  loadDetail();
}
function CC(cc) { return cc && cc.length ? ` <span class="cc">${esc(cc.join("/"))}</span>` : ""; }
function ageColor(h) {
  const mix = (a, b, t) => { t = Math.max(0, Math.min(1, t)); const p = x => [1, 3, 5].map(i => parseInt(x.substr(i, 2), 16)); const A = p(a), B = p(b); return "rgb(" + A.map((v, i) => Math.round(v + (B[i] - v) * t)).join(",") + ")"; };
  if (h < 24) return mix("#2fd36b", "#8fc24a", h / 24);
  if (h < 168) return mix("#f2a03a", "#c4692f", (h - 24) / 144);
  return mix("#8a8d88", "#5a5d59", (h - 168) / 552);
}
function heat(s) { return `background:${ageColor(s.hoursAgo)}${s.hoursAgo < 6 ? ";box-shadow:0 0 0 4px rgba(47,211,107,0.2)" : ""}`; }
function ownOnly() { return !!($("ownChk").checked && LOG); }
function ownList() { return LOG ? LOG.spots.filter(o => !LAKE || o.lake === LAKE).slice().reverse() : []; }
function renderCards() {
  if (ownOnly()) {
    const mine = ownList();
    $("cards").innerHTML = mine.length ? mine.map(o => `
    <div class="card ${"own:" + o.id === SEL ? "sel" : ""}" data-key="own:${esc(o.id)}">
      <div class="dot"></div>
      <div class="where">${esc((INIT.lakes.find(l => l.id === o.lake) || {}).name || o.lake)}<small>${esc(o.name || (o.x ? o.x + ":" + o.y : ""))}</small></div>
      <div class="ago"></div>
      <div class="line">${String(o.fish || "").split(",").map(f => f.trim()).filter(Boolean).map(f => `<span class="tag">${esc(f)}</span>`).join("")}${[o.bait, o.bait2].filter(Boolean).map(b => `<span class="tag b">${esc(b)}</span>`).join("")}</div>
    </div>`).join("") : `<div class="empty">${esc(T("logNoSpots", "Noch keine eigenen Spots."))}</div>`;
    document.querySelectorAll(".card").forEach(c => c.onclick = () => { SEL = c.dataset.key; renderCards(); drawMap(); loadDetail(); });
    return;
  }
  if (!ACTIVE.length) { $("cards").innerHTML = `<div class="empty">${esc(T("activeEmpty", "Keine Meldungen in diesem Zeitraum."))}</div>`; return; }
  $("cards").innerHTML = ACTIVE.map(s => `
    <div class="card ${s.key === SEL ? "sel" : ""}" data-key="${esc(s.key)}">
      <div class="dot" style="${heat(s)}"></div>
      <div class="where">${esc(s.lakeName)}<small>${esc(s.name)}</small></div>
      <div class="ago">${esc(ago(s.hoursAgo))}</div>
      <div class="line">${s.fish.map(f => `<span class="tag">${esc(f.name)}${CC(f.cc)}</span>`).join("")}${s.baits.map(b => `<span class="tag b">${esc(b.name)}</span>`).join("")}</div>
      <div class="meta"><span>${esc(T("catchesN", "{0} Fänge").replace("{0}", s.catches))}</span><span>${esc(s.sources.join(", "))}</span>${s.clip ? `<span>Clip ${esc(s.clip)} m</span>` : ""}</div>
    </div>`).join("");

  const qs = Object.keys(FIND).map(k => k + "=" + encodeURIComponent(FIND[k])).join("&");
  let d;
  try { d = await api("/api/find?" + qs); } catch (e) { return; }
  if (seq !== FSEQ) return;

}
function renderFindFilters() {

window.RF4 = {

    b.onclick = () => { showView(id); if (onShow) onShow(); };

async function loadExtensions() {

    if ($("abUpd")) $("abUpd").onclick = () => doUpdate($("abUpd"));
  }
};
function relNotes(md, title) {
  const out = [];
  let list = false;
  const parts = (md || "").split(/^\s*#+\s*Deutsch\s*$/m);
  const body = parts.length > 1 ? (INIT.lang === "de" ? parts[1] : parts[0]) : parts[0];
  body.split(/\r?\n/).forEach(raw => {
    const l = raw.trim();
    if (!l || /^\*\*Download/i.test(l)) return;
    const html = esc(l.replace(/^(#+|[*-])\s*/, "")).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/\[([^\]]+)\]\([^)]+\)/g, "$1");
    if (/^[*-]\s/.test(l)) { if (!list) { out.push('<ul style="margin:4px 0 8px 18px;padding:0">'); list = true; } out.push(`<li>${html}</li>`); return; }
    if (list) { out.push("</ul>"); list = false; }
    out.push(/^#/.test(l) ? `<div class="hdr" style="margin-top:6px">${html}</div>` : `<p class="sub" style="margin:0 0 6px">${html}</p>`);
  });
  if (list) out.push("</ul>");
  return out.length ? `<div style="margin-top:12px"><div class="hdr">${esc(title)}</div>${out.join("")}</div>` : "";
}
const LKS = {};
function lkNum(v) {
  const m = String(v == null ? "" : v).trim().match(/^(\d[\d.,\s]*)\s*(\S*)/);
  if (!m) return NaN;
  let t = m[1].replace(/\s/g, "");
  const seps = t.match(/[.,]/g) || [];
  if (seps.length > 1) { const k = Math.max(t.lastIndexOf("."), t.lastIndexOf(",")); t = t.slice(0, k).replace(/[.,]/g, "") + "." + t.slice(k + 1); }
  const n = parseFloat(t.replace(",", "."));
  return /^(kg|кг|公斤|千克|キロ|㎏|킬로)/i.test(m[2]) ? n * 1000 : n;
}
function lkSorted(id, list, getters) {
  const st = LKS[id], g = st && getters[st.i];
  if (!g) return list;
  const empty = v => v === "" || v === null || v === undefined || v === 0;
  return list.slice().sort((x, y) => {
    const a = g(x), b = g(y);
    if (empty(a) || empty(b)) return empty(a) - empty(b);
    const na = typeof a === "number" ? a : lkNum(a), nb = typeof b === "number" ? b : lkNum(b);
    if (!isNaN(na) && !isNaN(nb)) return (na - nb) * st.dir;
    return String(a).localeCompare(String(b), INIT.lang, { numeric: true }) * st.dir;
  });
}
function lkTh(id, i, label, cls) {
  const st = LKS[id], on = st && st.i === i;
  return `<th class="sortable ${cls || ""}" data-sid="${id}" data-si="${i}">${esc(label)}${on ? (st.dir > 0 ? " ▲" : " ▼") : ""}</th>`;
}
function lkSortBind(id, again, root) {
  (root || $("lkBody")).querySelectorAll(`th[data-sid="${id}"]`).forEach(h => h.onclick = () => {
    const i = +h.dataset.si, st = LKS[id];
    LKS[id] = st && st.i === i ? { i, dir: -st.dir } : { i, dir: h.classList.contains("num") ? -1 : 1 };
    again();
  });
}
function lkLakes(sel) {
  const L = LOOKUP.lakes, cur = L.find(l => l.id === sel) || L.find(l => l.id === (LAKE || FIND.lake)) || L[0];
  $("lkBody").innerHTML = `<div class="lk-split"><div class="lk-list">${L.map(l => `<div class="fish-row ${l.id === cur.id ? "sel" : ""}" data-l="${l.id}"><span>${esc(l.name)}</span></div>`).join("")}</div>
    <div style="overflow-y:auto"><h2 style="margin:0 0 8px;font-family:var(--font-display)">${esc(cur.name)}</h2><p class="sub" style="color:var(--ink-2);font-size:13.5px;line-height:1.5">${esc(cur.desc)}</p>
    <div class="hdr">${esc(T("fishHere", "Fische hier"))} (${cur.fish.length})</div>
    <table class="tbl"><tr>${lkTh("lake", 0, T("fish", "Fisch"))}${lkTh("lake", 1, T("trophy", "Trophäe"), "num")}${lkTh("lake", 2, T("rare", "Seltene Trophäe"), "num")}${lkTh("lake", 3, T("ownBest", "Dein bester"), "num logonly")}</tr>
    ${lkSorted("lake", cur.fish, [f => f.name, f => f.trophy, f => f.rare, f => f.own]).map(f => `<tr><td>${esc(f.name)}</td><td class="num">${esc(f.trophy)}</td><td class="num">${esc(f.rare)}</td><td class="num logonly">${esc(f.own)}${STAR(f)}</td></tr>`).join("")}</table></div></div>`;
  $("lkBody").querySelectorAll("[data-l]").forEach(r => r.onclick = () => lkLakes(r.dataset.l));
  lkSortBind("lake", () => lkLakes(cur.id));
}
function lkTrophies(q) {
  q = q === undefined ? FIND.q : q;
  const ex = LOOKUP.extra;
  const cols = [[T("fish", "Fisch"), "", f => f.name], [T("trophy", "Trophäe"), "num", f => f.trophy], [T("rare", "Seltene Trophäe"), "num", f => f.rare]]
    .concat(ex ? [[T("rarity", "Seltenheit"), "", f => f.rarity], [T("cardValue", "Kartenwert"), "num", f => f.card], [T("stars", "Sterne"), "", f => f.stars]] : [])
    .concat([[T("ownBest", "Dein bester"), "num logonly", f => f.own], [T("tabLakes", "Gewässer"), "", f => f.lakes.join(", ")]]);
  const list = lkSorted("tro", LOOKUP.trophies.filter(f => !q || f.name.toLowerCase().includes(q.toLowerCase())), cols.map(c => c[2]));
  $("lkBody").innerHTML = `<input class="search" id="lkQ" type="search" value="${esc(q)}" placeholder="${esc(T("fishSearch", "Fisch suchen"))}">
    <table class="tbl"><tr>${cols.map((c, i) => lkTh("tro", i, c[0], c[1])).join("")}</tr>
    ${list.map(f => `<tr><td>${esc(f.name)}</td><td class="num">${esc(f.trophy)}</td><td class="num">${esc(f.rare)}</td>${ex ? `<td>${esc(f.rarity)}</td><td class="num">${f.card ? esc(f.card.toLocaleString(INIT.lang)) : ""}</td><td class="star">${"★".repeat(f.stars || 0)}</td>` : ""}<td class="num logonly">${esc(f.own)}${STAR(f)}</td><td><small style="margin:0">${esc(f.lakes.join(", "))}</small></td></tr>`).join("")}</table>
    ${ex ? lkCredit() : ""}`;
  lkCreditBind();
  const inp = $("lkQ"); inp.focus(); inp.setSelectionRange(q.length, q.length);
  inp.oninput = () => { setFishQ(inp.value); lkTrophies(inp.value); };
  lkSortBind("tro", () => lkTrophies(inp.value));
}
const ITEM_KINDS = [["rods", "tabRods", "Ruten"], ["reels", "tabReels", "Rollen"], ["lines", "tabLines", "Schnüre"], ["lures", "tabLures", "Kunstköder"]];
const ITEM_TEXT = new Set(["itName", "itType", "itBrand", "itAction", "itPower", "itBonus", "itHooks"]);
const ITEMS_CACHE = {};
function lkCredit() { return `<p class="sub" style="margin:12px 0 0">${esc(T("srcRf4fish", "Daten von rf4.fish (ItsBlunty)"))} <button class="src" data-url="https://rf4.fish/">rf4.fish ↗</button></p>`; }
function lkCreditBind() { $("lkBody").querySelectorAll(".src[data-url]").forEach(b => b.onclick = () => api("/api/open", { url: b.dataset.url })); }
async function lkItems(kind, q) {
  q = q || "";
  let d = ITEMS_CACHE[kind];
  if (!d) {
    $("lkBody").innerHTML = `<div class="empty">${esc(T("itemsLoading", "Daten werden geladen …"))}</div>`;
    try { d = await api("/api/items?kind=" + kind); } catch (e) { $("lkBody").innerHTML = `<div class="empty">${esc(e.message)}</div>`; return; }
    if (!d.rows.length) {
      $("lkBody").innerHTML = `<div class="empty">${esc(d.error ? T("itemsFailed", "rf4.fish ist gerade nicht erreichbar: {0}").replace("{0}", d.error) : T("itemsLoading", "Daten werden geladen …"))}</div>`;
      if (!d.error) setTimeout(() => { const on = $("lkSeg") && $("lkSeg").querySelector("button.on"); if (on && on.dataset.v === kind) lkItems(kind); }, 3000);
      return;
    }
    ITEMS_CACHE[kind] = d;
  }
  const lq = q.toLowerCase();
  const list = lkSorted("it" + kind, d.rows.filter(r => !lq || r.some(v => String(v).toLowerCase().includes(lq))), d.cols.map((c, i) => r => r[i]));
  const shown = list.slice(0, 300);
  $("lkBody").innerHTML = `<input class="search" id="lkQ" type="search" value="${esc(q)}" placeholder="${esc(T("itemSearch", "Name, Marke oder Typ suchen"))}">
    <p class="sub" style="margin:0 0 8px">${esc(T("itemsCount", "{0} Einträge").replace("{0}", list.length.toLocaleString(INIT.lang)))}${list.length > shown.length ? " · " + esc(T("itemsFirst", "die ersten {0} werden angezeigt").replace("{0}", shown.length)) : ""}</p>
    <table class="tbl"><tr>${d.cols.map((c, i) => lkTh("it" + kind, i, T(c, c), ITEM_TEXT.has(c) ? "" : "num")).join("")}</tr>
    ${shown.map(r => `<tr>${r.map((v, i) => `<td class="${ITEM_TEXT.has(d.cols[i]) ? "" : "num"}">${d.cols[i] === "itBonus" ? `<small style="margin:0">${esc(v)}</small>` : esc(v)}</td>`).join("")}</tr>`).join("")}</table>
    ${lkCredit()}`;
  lkCreditBind();
  const inp = $("lkQ"); inp.focus(); inp.setSelectionRange(q.length, q.length);
  inp.oninput = () => lkItems(kind, inp.value);
  lkSortBind("it" + kind, () => lkItems(kind, inp.value));
}
$("logQ").oninput = () => { LOGQ = $("logQ").value.trim(); renderLog(); };
$("logLake").onchange = () => { LOGLAKE = $("logLake").value; renderLog(); };
$("findQ").oninput = () => setFishQ($("findQ").value);
$("winSeg").querySelectorAll("button").forEach(b => b.onclick = () => { FIND.win = b.dataset.w; $("winSeg").querySelectorAll("button").forEach(x => x.classList.toggle("on", x === b)); loadFind(); });
$("regionSel").onchange = () => { FIND.region = $("regionSel").value; loadFind(); };
$("tableSel").onchange = () => { FIND.table = $("tableSel").value; loadFind(); };
boot();
